<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Mobil Analiz - Gelişmiş</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#eef2f7;font:15px Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:15px;margin:12px 0}
h1{font-size:24px;margin:4px 0 3px}.muted{color:#9da7b3}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#238636;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button.secondary{background:#21262d;border:1px solid #3a4350}
select{width:100%;padding:13px;border-radius:10px;border:1px solid #3a4350;background:#0d1117;color:#fff}
.match{padding:12px;border:1px solid #30363d;border-radius:12px;margin:8px 0;cursor:pointer}
.match:hover{border-color:#58a6ff}.match.active{border-color:#238636;background:#17251b}
.teams{font-size:17px;font-weight:800}.meta{font-size:12px;color:#9da7b3;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-block;padding:5px 8px;border-radius:12px;background:#263b2b;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.market{border:1px solid #30363d;border-radius:12px;padding:11px;margin:8px 0}
.market h4{margin:0 0 8px;font-size:14px;color:#58a6ff}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #242b33}
.row:first-of-type{border-top:0}.value{font-weight:800;color:#2ea043}
.score{font-size:42px;font-weight:900;margin:4px 0}
.pick{font-size:19px;font-weight:900}
.warn{background:#302714;color:#f2cc60;padding:10px;border-radius:10px;margin-top:10px}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:7px;border-bottom:1px solid #30363d;text-align:center}
.small{font-size:12px}.hidden{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.score{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
<h1>⚽ İddaa Mobil Analiz</h1>
<p class="muted">Bütün Bahis Marketleri (Alt/Üst, KG, İY/MS, Çifte Şans)</p>

<div class="card">
  <button onclick="loadMatches()">🔄 Maçları ve oranları otomatik getir</button>
  <div id="status" class="muted" style="margin-top:9px">Hazır.</div>
</div>

<div class="card">
  <h3>📅 Maç Seç</h3>
  <select id="matchSelect" onchange="selectMatch(this.value)">
    <option value="">Önce maçları getir</option>
  </select>
  <div id="selectedMatch" class="muted" style="margin-top:10px">Maç seçilmedi.</div>
</div>

<div id="analysisArea" class="hidden">
  <div class="card">
    <h3>📊 Otomatik Analiz & Öne Çıkanlar</h3>
    <div id="summary"></div>
  </div>

  <div class="card">
    <h3>💰 Bütün Bahisler ve Oranlar</h3>
    <div id="markets"></div>
  </div>

  <div class="card">
    <h3>🔥 Son 5 Maç Formu</h3>
    <div id="form"></div>
  </div>
</div>

<div class="card">
  <h3>📋 Güncel Maçlar</h3>
  <div id="matches" class="muted">Henüz veri alınmadı.</div>
</div>
</div>

<script>
let matches=[], selected=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const val=(o,...keys)=>{for(const k of keys){if(o && o[k]!==undefined && o[k]!==null && o[k]!=='')return o[k]}return null};
const num=v=>{let n=Number(v);return Number.isFinite(n)?n:null};

async function loadMatches(){
 const s=document.getElementById('status');
 s.textContent='Maçlar ve oranlar alınıyor...';
 try{
   const r=await fetch('/api/matches',{cache:'no-store'});
   const j=await r.json();
   if(!j.ok) throw Error(j.error||'Veri alınamadı');
   matches=Array.isArray(j.matches)?j.matches:[];
   renderMatches();
   const sel=document.getElementById('matchSelect');
   sel.innerHTML='<option value="">Maç seçiniz</option>'+
     matches.map((m,i)=>`<option value="${i}">${esc(m.home||'-')} - ${esc(m.away||'-')}</option>`).join('');
   s.textContent=`${matches.length} maç alındı • ${new Date().toLocaleTimeString('tr-TR')}`;
 }catch(e){
   s.textContent='Hata: '+e.message;
 }
}

function renderMatches(){
 const box=document.getElementById('matches');
 if(!matches.length){box.textContent='Maç bulunamadı.';return}
 box.innerHTML=matches.map((m,i)=>`
 <div class="match ${selected===m?'active':''}" onclick="selectMatch(${i})">
   <div class="teams">${esc(m.home||'-')} — ${esc(m.away||'-')}</div>
   <div class="meta">${esc(m.league||'')} ${esc(m.time||'')}</div>
   <div class="tags">
     <span class="tag">MS1: ${esc(val(m,'ms1')??'-')}</span>
     <span class="tag">MSX: ${esc(val(m,'msx')??'-')}</span>
     <span class="tag">MS2: ${esc(val(m,'ms2')??'-')}</span>
     <span class="tag">Üst 2.5: ${esc(val(m,'over25')??'-')}</span>
   </div>
 </div>`).join('');
}

async function selectMatch(index){
 if(index==='' || index===null || index===undefined)return;
 selected=matches[Number(index)];
 document.getElementById('matchSelect').value=String(index);
 document.getElementById('analysisArea').classList.remove('hidden');
 document.getElementById('selectedMatch').innerHTML=
   `<b>${esc(selected.home||'-')} — ${esc(selected.away||'-')}</b><br><span class="muted">${esc(selected.league||'')} ${esc(selected.time||'')}</span>`;
 renderAll(selected);
 renderMatches();

 try{
   const params = new URLSearchParams({
     home: selected.home || '',
     away: selected.away || '',
     url: selected.url || ''
   });
   const r=await fetch('/api/match-analysis?'+params.toString(),{cache:'no-store'});
   const j=await r.json().catch(()=>({}));
   if(j && j.ok){
     selected=Object.assign({},selected,j.match||{});
     renderAll(selected);
   }else{
     const msg=(j && j.error) ? j.error : 'Detay verisi alınamadı.';
     document.getElementById('summary').insertAdjacentHTML(
       'beforeend',
       `<div class="warn">⚠️ ${esc(msg)}</div>`
     );
   }
 }catch(e){
   document.getElementById('summary').insertAdjacentHTML(
     'beforeend',
     `<div class="warn">⚠️ Detay bağlantısı kurulamadı.</div>`
   );
 }
}

function implied(a){
 const p=Object.entries(a||{}).map(([k,v])=>[k,num(v)]).filter(x=>x[1]>0);
 const raw=p.map(([k,v])=>[k,100/v]);
 const sum=raw.reduce((s,x)=>s+x[1],0);
 return raw.map(([k,v])=>[k,sum?v/sum*100:0]);
}

function topPick(m){
 const arr=implied({
   'MS1':val(m,'ms1'),
   'MSX':val(m,'msx'),
   'MS2':val(m,'ms2')
 });
 return arr.sort((a,b)=>b[1]-a[1])[0];
}

function pickPct(m,...keys){
 const o=val(m,...keys), n=num(o);
 if(!n||n<=0)return '-';
 const all=implied({ MS1:val(m,'ms1'), MSX:val(m,'msx'), MS2:val(m,'ms2') });
 const found=all.find(x=>keys.includes(x[0]));
 return found ? found[1].toFixed(1) : (100/n).toFixed(1);
}

function renderAll(m){
 renderSummary(m); renderMarkets(m); renderForm(m);
}

function renderSummary(m){
 const pick=topPick(m);
 const score=pick?Math.round(Math.min(98,45+pick[1]*.55)):0;
 document.getElementById('summary').innerHTML=`
   <div class="score">${score}/100</div>
   <div class="pick">🎯 Öne çıkan: ${esc(pick?pick[0]:'Veri bekleniyor')}</div>
   ${pick?`<p>MS1: ${pickPct(m,'MS1')}% • MSX: ${pickPct(m,'MSX')}% • MS2: ${pickPct(m,'MS2')}%</p>`:''}
   <div class="grid">
     <div class="market"><h4>⚽ KG Var / Yok</h4>${line('KG Var',val(m,'bttsYes'))}${line('KG Yok',val(m,'bttsNo'))}</div>
     <div class="market"><h4>🔢 Üst/Alt 2.5</h4>${line('Üst 2.5',val(m,'over25','over25'))}${line('Alt 2.5',val(m,'under25','under25'))}</div>
   </div>`;
}

function line(k,v){
 return `<div class="row"><span>${esc(k)}</span><span class="value">${esc(v??'-')}</span></div>`;
}

function renderMarkets(m){
 const mk=m.markets||m||{};
 const sections=[
  ['🏁 Maç Sonucu & Çifte Şans',[
    ['MS 1',val(mk,'ms1')],['MS X',val(mk,'msx')],['MS 2',val(mk,'ms2')],
    ['ÇŞ 1X',val(mk,'doubleChance1X')],['ÇŞ X2',val(mk,'doubleChanceX2')],['ÇŞ 12',val(mk,'doubleChance12')]
  ]],
  ['⚽ Karşılıklı Gol (KG)',[
    ['KG Var',val(mk,'bttsYes')],['KG Yok',val(mk,'bttsNo')]
  ]],
  ['🔢 Bütün Maç Alt / Üst Seçenekleri',[
    ['Alt 0.5',val(mk,'under05')],['Üst 0.5',val(mk,'over05')],
    ['Alt 1.5',val(mk,'under15')],['Üst 1.5',val(mk,'over15')],
    ['Alt 2.5',val(mk,'under25')],['Üst 2.5',val(mk,'over25')],
    ['Alt 3.5',val(mk,'under35')],['Üst 3.5',val(mk,'over35')],
    ['Alt 4.5',val(mk,'under45')],['Üst 4.5',val(mk,'over45')]
  ]],
  ['🟨 İlk Yarı (İY) Bahisleri',[
    ['İY 1',val(mk,'ht1')],['İY X',val(mk,'htX')],['İY 2',val(mk,'ht2')],
    ['İY Alt 0.5',val(mk,'htUnder05')],['İY Üst 0.5',val(mk,'htOver05')],
    ['İY Alt 1.5',val(mk,'htUnder15')],['İY Üst 1.5',val(mk,'htOver15')],
    ['İY Alt 2.5',val(mk,'htUnder25')],['İY Üst 2.5',val(mk,'htOver25')]
  ]],
  ['🔄 İY / MS Kombinasyonları',[
    ['1/1',val(mk,'htft11')],['1/X',val(mk,'htft1x')],['1/2',val(mk,'htft12')],
    ['X/1',val(mk,'htftx1')],['X/X',val(mk,'htftxx')],['X/2',val(mk,'htftx2')],
    ['2/1',val(mk,'htft21')],['2/X',val(mk,'htft2x')],['2/2',val(mk,'htft22')]
  ]]
 ];

 document.getElementById('markets').innerHTML=sections.map(([title,rows])=>{
   const available=rows.some(x=>x[1]!==null && x[1]!==undefined);
   return `<div class="market"><h4>${title}</h4>${available?rows.filter(x=>x[1]!==null && x[1]!==undefined).map(x=>line(x[0],x[1])).join(''):'<span class="muted small">Bu market için oran çekilemedi.</span>'}</div>`;
 }).join('');
}

function renderForm(m){
 const f=m.homeForm;
 document.getElementById('form').innerHTML=`
   <div class="market">
    <h4>🏠 Son Karşılaşmalar</h4>
    ${formBlock(f)}
   </div>`;
}

function formBlock(f){
 if(!Array.isArray(f)||!f.length)return '<span class="muted">Form verisi yok.</span>';
 return `<div class="form">${f.slice(0,5).map(x=>`<b>${esc(x.home||'')} ${esc(x.score||'-')} ${esc(x.away||'')}</b>`).join('<br>')}</div>`;
}
</script>
</body>
</html>
