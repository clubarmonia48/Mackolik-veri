<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Mobil Analiz</title>
<style>
body{margin:0;background:#0d1117;color:#eef2f7;font:15px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:15px;margin:12px 0}
h1{font-size:24px;margin:4px 0}.muted{color:#9da7b3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #3a4350;background:#0d1117;color:#fff}button{background:#238636;border:0;font-weight:bold;margin-top:10px}
.match{padding:12px 0;border-bottom:1px solid #30363d}.score{font-size:30px;font-weight:800}.tag{display:inline-block;padding:4px 8px;border-radius:12px;background:#263b2b;margin:3px 2px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>⚽ İddaa Mobil Analiz</h1><p class="muted">Telefon için sunucu tabanlı sürüm</p>
<div class="card"><button onclick="loadMatches()">🔄 Maçları ve oranları getir</button><div id="status" class="muted"></div></div>
<div class="card"><h3>📊 Analiz</h3><div class="grid">
<input id="o1" type="number" step=".01" placeholder="MS1 açılış oranı">
<input id="ox" type="number" step=".01" placeholder="MSX açılış oranı">
<input id="o2" type="number" step=".01" placeholder="MS2 açılış oranı">
<input id="ou" type="number" step=".01" placeholder="Üst 2.5">
</div><button onclick="analyze()">ANALİZ ET</button><div id="analysis"></div></div>
<div class="card"><h3>📅 Güncel Maçlar</h3><div id="matches" class="muted">Henüz veri alınmadı.</div></div>
</div>
<script>
async function loadMatches(){
 const s=document.getElementById('status');s.textContent='Veriler alınıyor...';
 try{let r=await fetch('/api/matches');let j=await r.json();if(!j.ok)throw Error(j.error||'Veri alınamadı');
 document.getElementById('matches').innerHTML=j.matches.map(m=>`<div class="match"><b>${m.home} - ${m.away}</b><br><small>${m.league||''} ${m.time||''}</small><br>
<span class="tag">1: ${m.ms1||'-'}</span><span class="tag">X: ${m.msx||'-'}</span><span class="tag">2: ${m.ms2||'-'}</span>
<span class="tag">Üst 2.5: ${m.over25||'-'}</span></div>`).join('')||'Maç bulunamadı.';
 s.textContent=`${j.matches.length} maç alındı • ${new Date().toLocaleTimeString('tr-TR')}`;
 }catch(e){s.textContent='Hata: '+e.message}}
function p(o){return o>0?100/o:0}
function analyze(){
 let a=+o1.value,b=+ox.value,c=+o2.value,arr=[p(a),p(b),p(c)],sum=arr.reduce((x,y)=>x+y,0);
 let x=arr.map(v=>sum?v/sum*100:0),best=Math.max(...x),score=Math.round(Math.min(100,Math.max(0,45+best*.55)));
 let pick=x[0]>=x[1]&&x[0]>=x[2]?'MS1':x[1]>=x[2]?'MSX':'MS2';
 analysis.innerHTML=`<p class="score">${score}/100</p><b>Öne çıkan: ${pick}</b><p>MS1: ${x[0].toFixed(1)}% • MSX: ${x[1].toFixed(1)}% • MS2: ${x[2].toFixed(1)}%</p><p class="muted">Bu skor yalnızca girilen oranlardan türetilir; geçmiş başarı yüzdesi için arşivlenen gerçek maç verisi gerekir.</p>`;
}
</script></body></html>
