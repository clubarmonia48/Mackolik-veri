<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Mobil Analiz - Gelişmiş</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#eef2f7;font:15px Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:15px;margin:12px 0}
h1{font-size:24px;margin:4px 0 3px}.muted{color:#9da7b3}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#238636;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button.secondary{background:#21262d;border:1px solid #3a4350}
select{width:100%;padding:13px;border-radius:10px;border:1px solid #3a4350;background:#0d1117;color:#fff}
.match{padding:12px;border:1px solid #30363d;border-radius:12px;margin:8px 0;cursor:pointer}
.match:hover{border-color:#58a6ff}.match.active{border-color:#238636;background:#17251b}
.teams{font-size:17px;font-weight:800}.meta{font-size:12px;color:#9da7b3;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-block;padding:5px 8px;border-radius:12px;background:#263b2b;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.market{border:1px solid #30363d;border-radius:12px;padding:11px;margin:8px 0}
.market h4{margin:0 0 8px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #242b33}
.row:first-of-type{border-top:0}.value{font-weight:800}
.score{font-size:42px;font-weight:900;margin:4px 0}
.pick{font-size:19px;font-weight:900}
.good{background:#19351f;border-color:#2ea043}.warn{background:#302714}
.progress{height:9px;background:#21262d;border-radius:10px;overflow:hidden;margin:6px 0 10px}
.progress i{display:block;height:100%;background:#238636}
.form{display:flex;gap:6px;flex-wrap:wrap}.form b{padding:6px 8px;border-radius:8px;background:#21262d}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:7px;border-bottom:1px solid #30363d;text-align:center}
.small{font-size:12px}.hidden{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.score{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
<h1>⚽ İddaa Mobil Analiz</h1>
<p class="muted">Otomatik oran + geniş market + son 5 maç analizi</p>

<div class="card">
  <button onclick="loadMatches()">🔄 Maçları ve oranları otomatik getir</button>
  <div id="status" class="muted" style="margin-top:9px">Hazır.</div>
</div>

<div class="card">
  <h3>📅 Maç Seç</h3>
  <select id="matchSelect" onchange="selectMatch(this.value)">
    <option value="">Önce maçları getir</option>
  </select>
  <div id="selectedMatch" class="muted" style="margin-top:10px">Maç seçilmedi.</div>
</div>

<div id="analysisArea" class="hidden">
  <div class="card">
    <h3>📊 Otomatik Analiz</h3>
    <div id="summary"></div>
  </div>

  <div class="card">
    <h3>💰 Tüm Oranlar</h3>
    <div id="markets"></div>
  </div>

  <div class="card">
    <h3>🔥 Son 5 Maç Formu</h3>
    <div id="form"></div>
  </div>

  <div class="card">
    <h3>🤝 İki Takımın Son 5 Karşılaşması</h3>
    <div id="h2h"></div>
  </div>
</div>

<div class="card">
  <h3>📋 Güncel Maçlar</h3>
  <div id="matches" class="muted">Henüz veri alınmadı.</div>
</div>
</div>

<script>
let matches=[], selected=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const val=(o,...keys)=>{for(const k of keys){if(o && o[k]!==undefined && o[k]!==null && o[k]!=='')return o[k]}return null};
const num=v=>{let n=Number(v);return Number.isFinite(n)?n:null};

async function loadMatches(){
 const s=document.getElementById('status');
 s.textContent='Maçlar ve oranlar alınıyor...';
 try{
   const r=await fetch('/api/matches',{cache:'no-store'});
   const j=await r.json();
   if(!j.ok) throw Error(j.error||'Veri alınamadı');
   matches=Array.isArray(j.matches)?j.matches:[];
   renderMatches();
   const sel=document.getElementById('matchSelect');
   sel.innerHTML='<option value="">Maç seçiniz</option>'+
     matches.map((m,i)=>`<option value="${i}">${esc(m.home||'-')} - ${esc(m.away||'-')}</option>`).join('');
   s.textContent=`${matches.length} maç alındı • ${new Date().toLocaleTimeString('tr-TR')}`;
 }catch(e){
   s.textContent='Hata: '+e.message;
 }
}

function renderMatches(){
 const box=document.getElementById('matches');
 if(!matches.length){box.textContent='Maç bulunamadı.';return}
 box.innerHTML=matches.map((m,i)=>`
 <div class="match ${selected===m?'active':''}" onclick="selectMatch(${i})">
   <div class="teams">${esc(m.home||'-')} — ${esc(m.away||'-')}</div>
   <div class="meta">${esc(m.league||'')} ${esc(m.time||'')}</div>
   <div class="tags">
     <span class="tag">MS1: ${esc(val(m,'ms1','homeWin','odds1')??'-')}</span>
     <span class="tag">MSX: ${esc(val(m,'msx','draw','oddsX')??'-')}</span>
     <span class="tag">MS2: ${esc(val(m,'ms2','awayWin','odds2')??'-')}</span>
     <span class="tag">Üst 2.5: ${esc(val(m,'over25','over_2_5')??'-')}</span>
     <span class="tag">KG: ${esc(val(m,'bttsYes','kgVar','btts')??'-')}</span>
   </div>
 </div>`).join('');
}

async function selectMatch(index){
 if(index==='' || index===null || index===undefined)return;
 selected=matches[Number(index)];
 document.getElementById('matchSelect').value=String(index);
 document.getElementById('analysisArea').classList.remove('hidden');
 document.getElementById('selectedMatch').innerHTML=
   `<b>${esc(selected.home||'-')} — ${esc(selected.away||'-')}</b><br><span class="muted">${esc(selected.league||'')} ${esc(selected.time||'')}</span>`;
 renderAll(selected);
 renderMatches();

 // Ayrıntılı market/form/H2H verisini takım adlarıyla backend'den al.
 try{
   const qs=new URLSearchParams({
     home:selected.home||'',
     away:selected.away||'',
     time:selected.time||''
   });
   const r=await fetch('/api/match-analysis?'+qs.toString(),{cache:'no-store'});
   const j=await r.json().catch(()=>null);
   if(j && j.ok){
     const extra=j.match||j.data||j;
     selected=Object.assign({},selected,extra);
     if(extra.markets) selected.markets=Object.assign({},selected.markets||{},extra.markets);
     renderAll(selected);
     const ds=document.getElementById('detailStatus');
     if(ds) ds.textContent='✅ Detay marketler ve takım verileri alındı.';
   } else {
     const ds=document.getElementById('detailStatus');
     if(ds) ds.textContent='⚠️ Detay verisi alınamadı: '+((j&&j.error)||('HTTP '+r.status));
   }
 }catch(e){
   const ds=document.getElementById('detailStatus');
   if(ds) ds.textContent='⚠️ Detay bağlantı hatası: '+e.message;
 }
}


function implied(a){
 const p=Object.entries(a||{}).map(([k,v])=>[k,num(v)]).filter(x=>x[1]>0);
 const raw=p.map(([k,v])=>[k,100/v]);
 const sum=raw.reduce((s,x)=>s+x[1],0);
 return raw.map(([k,v])=>[k,sum?v/sum*100:0]);
}

function topPick(m){
 const arr=implied({
   'MS1':val(m,'ms1','homeWin','odds1'),
   'MSX':val(m,'msx','draw','oddsX'),
   'MS2':val(m,'ms2','awayWin','odds2')
 });
 return arr.sort((a,b)=>b[1]-a[1])[0];
}

function renderAll(m){
 renderSummary(m); renderMarkets(m); renderForm(m); renderH2H(m);
}

function calculateAnalysisScore(m){
  const odds = [
    val(m,'ms1','homeWin','odds1'),
    val(m,'msx','draw','oddsX'),
    val(m,'ms2','awayWin','odds2')
  ].map(num).filter(v=>v && v>0);

  if(!odds.length) return 0;

  // Sadece gerçekten gelen oranları kullanır; eksik istatistik uydurmaz.
  const probabilities = implied({
    MS1:val(m,'ms1','homeWin','odds1'),
    MSX:val(m,'msx','draw','oddsX'),
    MS2:val(m,'ms2','awayWin','odds2')
  });
  const top = probabilities.length ? Math.max(...probabilities.map(x=>x[1])) : 0;

  const extraMarkets = [
    val(m,'over25','over_2_5'),
    val(m,'under25','under_2_5'),
    val(m,'bttsYes','kgVar','btts_yes'),
    val(m,'bttsNo','kgYok','btts_no')
  ].filter(v=>num(v)>0).length;

  const hasForm = Array.isArray(m.homeForm||m.homeLast5||m.form?.home) &&
                  Array.isArray(m.awayForm||m.awayLast5||m.form?.away);
  const hasH2H = Array.isArray(m.h2h||m.headToHead||m.last5H2H);

  let score = 35 + top*0.55 + extraMarkets*3;
  if(hasForm) score += 8;
  if(hasH2H) score += 7;

  return Math.round(Math.max(0,Math.min(100,score)));
}

function renderSummary(m){
 const pick=topPick(m);
 const formScore=num(val(m,'analysisScore','score','confidence'));
 const score=(formScore!==null && formScore>0) ? Math.round(Math.max(0,Math.min(100,formScore))) : calculateAnalysisScore(m);
 document.getElementById('summary').innerHTML=`
   <div class="score">${score}/100</div>
   <div class="pick">🎯 Öne çıkan: ${esc(pick?pick[0]:'Veri bekleniyor')}</div>
   ${pick?`<p>MS1: ${pickPct(m,'ms1','homeWin','odds1')}% • MSX: ${pickPct(m,'msx','draw','oddsX')}% • MS2: ${pickPct(m,'ms2','awayWin','odds2')}%</p>`:''}
   <div id="detailStatus" class="muted small" style="margin:8px 0"></div>
   <div class="grid">
     <div class="market"><h4>⚽ Gol</h4>${line('KG Var',val(m,'bttsYes','kgVar'))}${line('KG Yok',val(m,'bttsNo','kgYok'))}</div>
     <div class="market"><h4>🔢 Üst/Alt 2.5</h4>${line('Üst 2.5',val(m,'over25','over_2_5'))}${line('Alt 2.5',val(m,'under25','under_2_5'))}</div>
   </div>`;
}

function pickPct(m,...keys){
 const n=num(val(m,...keys));
 if(!n||n<=0)return '-';

 const odds={
  MS1:num(val(m,'ms1','homeWin','odds1')),
  MSX:num(val(m,'msx','draw','oddsX')),
  MS2:num(val(m,'ms2','awayWin','odds2'))
 };

 const label = keys.some(k=>['ms1','homeWin','odds1'].includes(k)) ? 'MS1'
              : keys.some(k=>['msx','draw','oddsX'].includes(k)) ? 'MSX'
              : keys.some(k=>['ms2','awayWin','odds2'].includes(k)) ? 'MS2'
              : null;

 if(!label || !odds[label])return '-';

 const valid=Object.values(odds).filter(v=>v && v>0);
 const total=valid.reduce((s,v)=>s+(1/v),0);
 return ((1/odds[label])/total*100).toFixed(1);
}

function line(k,v){
 return `<div class="row"><span>${esc(k)}</span><span class="value">${esc(v??'-')}</span></div>`;
}

function renderMarkets(m){
 const markets=m.markets||m.odds||{};
 const sections=[
  ['🏁 Maç Sonucu',[
    ['MS1',val(m,'ms1','homeWin','odds1')],['MSX',val(m,'msx','draw','oddsX')],['MS2',val(m,'ms2','awayWin','odds2')],
    ['ÇŞ 1X',val(markets,'doubleChance1X','dc1x')],['ÇŞ X2',val(markets,'doubleChanceX2','dcx2')],['ÇŞ 12',val(markets,'doubleChance12','dc12')]
  ]],
  ['⚽ KG / Gol',[
    ['KG Var',val(m,'bttsYes','kgVar', 'btts_yes')],['KG Yok',val(m,'bttsNo','kgYok','btts_no')]
  ]],
  ['🔢 Maç Üst / Alt',[
    ['Üst 0.5',val(markets,'over05','over_0_5')],['Alt 0.5',val(markets,'under05','under_0_5')],
    ['Üst 1.5',val(markets,'over15','over_1_5')],['Alt 1.5',val(markets,'under15','under_1_5')],
    ['Üst 2.5',val(m,'over25','over_2_5')],['Alt 2.5',val(m,'under25','under_2_5')],
    ['Üst 3.5',val(markets,'over35','over_3_5')],['Alt 3.5',val(markets,'under35','under_3_5')],
    ['Üst 4.5',val(markets,'over45','over_4_5')],['Alt 4.5',val(markets,'under45','under_4_5')]
  ]],
  ['🟨 İlk Yarı',[
    ['İY 1',val(markets,'ht1','firstHalf1')],['İY X',val(markets,'htX','firstHalfX')],['İY 2',val(markets,'ht2','firstHalf2')],
    ['İY Üst 0.5',val(markets,'htOver05','firstHalfOver05')],['İY Alt 0.5',val(markets,'htUnder05','firstHalfUnder05')],
    ['İY Üst 1.5',val(markets,'htOver15','firstHalfOver15')],['İY Alt 1.5',val(markets,'htUnder15','firstHalfUnder15')],
    ['İY Üst 2.5',val(markets,'htOver25','firstHalfOver25')],['İY Alt 2.5',val(markets,'htUnder25','firstHalfUnder25')]
  ]],
  ['🔄 İY/MS Kombinasyonları',[
    ['1/1',val(markets,'1_1','htft11')],['1/X',val(markets,'1_X','htft1x')],['1/2',val(markets,'1_2','htft12')],
    ['X/1',val(markets,'X_1','htftx1')],['X/X',val(markets,'X_X','htftxx')],['X/2',val(markets,'X_2','htftx2')],
    ['2/1',val(markets,'2_1','htft21')],['2/X',val(markets,'2_X','htft2x')],['2/2',val(markets,'2_2','htft22')]
  ]]
 ];
 document.getElementById('markets').innerHTML=sections.map(([title,rows])=>{
   const available=rows.some(x=>x[1]!==null);
   return `<div class="market"><h4>${title}</h4>${available?rows.filter(x=>x[1]!==null).map(x=>line(x[0],x[1])).join(''):'<span class="muted small">Bu market için sunucudan oran gelmedi.</span>'}</div>`;
 }).join('');
}

function renderForm(m){
 const home=m.homeForm||m.homeLast5||m.form?.home;
 const away=m.awayForm||m.awayLast5||m.form?.away;
 const avg=(m.statistics||m.stats||{});
 document.getElementById('form').innerHTML=`
   <div class="grid">
    <div class="market"><h4>🏠 ${esc(m.home||'Ev sahibi')}</h4>${formBlock(home)}</div>
    <div class="market"><h4>✈️ ${esc(m.away||'Deplasman')}</h4>${formBlock(away)}</div>
   </div>
   <div class="market">
    <h4>📈 Son 5 istatistik</h4>
    ${line('Ev sahibi gol ort.',val(avg,'homeGoalsAvg','home_avg_goals'))}
    ${line('Deplasman gol ort.',val(avg,'awayGoalsAvg','away_avg_goals'))}
    ${line('KG Var %',val(avg,'bttsPct','btts_percent'))}
    ${line('Üst 2.5 %',val(avg,'over25Pct','over25_percent'))}
   </div>`;
}
function formBlock(f){
 if(!Array.isArray(f)||!f.length)return '<span class="muted">Son 5 maç verisi sunucudan gelmedi.</span>';
 return `<div class="form">${f.slice(0,5).map(x=>{
   if(typeof x==='string') return `<b>${esc(x)}</b>`;
   const r=String(x.result||x.outcome||'').toUpperCase();
   const score=x.score || x.goals || ((x.homeGoals??null)!==null || (x.awayGoals??null)!==null ? `${x.homeGoals??'-'}-${x.awayGoals??'-'}` : '-');
   return `<b>${esc(score)} ${esc(r)}</b>`;
 }).join('')}</div>`;
}

function renderH2H(m){
 const h=m.h2h||m.headToHead||m.last5H2H;
 if(!Array.isArray(h)||!h.length){
   document.getElementById('h2h').innerHTML='<span class="muted">H2H son 5 karşılaşma verisi sunucudan gelmedi.</span>';
   return;
 }
 document.getElementById('h2h').innerHTML=`<table class="table"><tr><th>Tarih</th><th>Maç</th><th>Skor</th><th>KG</th><th>Ü/A 2.5</th></tr>${
 h.slice(0,5).map(x=>{
   const score=x.score||((x.homeGoals??'-')+'-'+(x.awayGoals??'-'));
   const goals=[x.homeGoals,x.awayGoals].every(v=>v!==undefined)?Number(x.homeGoals)+Number(x.awayGoals):null;
   return `<tr><td>${esc(x.date||'-')}</td><td>${esc(x.home||'')} - ${esc(x.away||'')}</td><td><b>${esc(score)}</b></td><td>${goals!==null?(goals>0?'Var':'Yok'):esc(x.btts??'-')}</td><td>${goals!==null?(goals>2.5?'Üst':'Alt'):esc(x.over25??'-')}</td></tr>`;
 }).join('')}</table>`;
}
</script>
</body>
</html>
